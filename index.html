<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Budget Tracker</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Header -->
    <header id="page-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>


    <!-- Add Expense Section -->
    <section id="add-expense">
        <h2>Add Expense</h2>

        <input
            type="text"
            placeholder="Expense name"
        >

        <input
            type="number"
            placeholder="Amount"
        >

        <input
            type="text"
            placeholder="Category"
        >
    </section>


    <!-- Your Expenses Section -->
    <section id="your-expenses">
        <h2>Your Expenses</h2>

        <p>No expenses yet.</p>
    </section>

</body>
</html>
